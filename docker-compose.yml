services:
  homebase-app:
    build: .
    image: homebase:latest
    container_name: homebase-app
    restart: unless-stopped
    env_file: .env.local
    ports:
      - "3001:3000"
    volumes:
      - /volume1/docker/homebase/Data:/data
      - /volume1/homebase/Data/images:/data/images
      - /volume1/docker/homebase/cloudflared:/etc/cloudflared
    environment:
      - DATABASE_URL=file:/data/homebase.db
      - NODE_ENV=production
      - AUTH_URL=https://homebase.liddleapps.com
      - NEXTAUTH_URL=https://homebase.liddleapps.com
    networks:
      - homebase-network

networks:
  homebase-network:
    driver: bridge
    name: homebase-network
