<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline – Homebase</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #09090b; color: #fafafa;
      display: flex; justify-content: center; align-items: center;
      min-height: 100vh; padding: 1rem;
    }
    .card {
      text-align: center; max-width: 320px; width: 100%;
      background: #18181b; border: 1px solid #27272a;
      border-radius: 1.25rem; padding: 2.5rem 2rem;
    }
    .icon { font-size: 2.5rem; margin-bottom: 1rem; }
    h1 { font-size: 1.125rem; font-weight: 600; margin-bottom: 0.5rem; }
    p  { font-size: 0.875rem; color: #a1a1aa; line-height: 1.6; margin-bottom: 1.75rem; }
    button {
      background: #fafafa; color: #09090b; border: none;
      padding: 0.75rem 1.75rem; border-radius: 999px;
      cursor: pointer; font-size: 0.875rem; font-weight: 500;
    }
    button:active { opacity: 0.85; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">○</div>
    <h1>You're offline</h1>
    <p>This page hasn't been cached yet. Visit it once while connected and it'll be available offline next time.</p>
    <button onclick="history.back()">Go back</button>
  </div>
</body>
</html>
